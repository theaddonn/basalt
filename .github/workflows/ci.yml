name: CI

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format
        # keep in sync with the version used locally
        run: pip install clang-format==20.1.8
      - name: Check formatting
        run: |
          git ls-files -z '*.cpp' '*.hpp' '*.h' '*.cc' \
            | xargs -0 --no-run-if-empty clang-format --dry-run --Werror

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - name: Install clang-tidy
        # keep in sync with the version used locally
        run: pip install clang-tidy==20.1.0
      - name: Generate compile databases
        run: |
          xmake f -m release -y
          xmake project -k compile_commands build
          cd tools/icons
          xmake f -P . -m release -y
          xmake project -P . -k compile_commands build
      - name: Run clang-tidy
        run: |
          git ls-files -z 'src/*.cpp' 'tests/*.cpp' \
            | xargs -0 clang-tidy -p build --quiet --warnings-as-errors='*'
          clang-tidy -p tools/icons/build --quiet --warnings-as-errors='*' \
            tools/icons/main.cpp

  build:
    name: build (${{ matrix.os }}, ${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        mode: [dist]
        include:
          # debug builds run tests under address + undefined behaviour sanitizers
          - os: ubuntu-latest
            mode: debug
          - os: macos-latest
            mode: debug
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - name: Configure
        run: xmake f -m ${{ matrix.mode }} -y
      - name: Build
        run: xmake -y
      - name: Test
        run: xmake test -y
      - name: Upload Windows binary
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: basalt-windows
          path: build/windows/x64/dist/basalt.exe

  appimage:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
      - name: Build
        run: |
          xmake f -m dist -y
          xmake -y
      - name: Create AppDir
        run: |
          xmake install -o AppDir/usr basalt
          cp res/basalt.desktop res/basalt.png AppDir/
          cp res/basalt.png AppDir/.DirIcon
          ln -s usr/bin/basalt AppDir/AppRun
      - name: Build AppImage
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir basalt-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: basalt-appimage
          path: basalt-x86_64.AppImage
